<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talk to Me</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Talk to Me</h1>
    </header>

    <div class="form-group output-group">
      <textarea
        id="system-output"
      ></textarea>
      <p class="hint"></p>
    </div>

    <div class="form-group input-group">
      <textarea
        id="user-input"
        placeholder="Nhập Promt..."
      ></textarea>
      <button id="generate-btn" class="btn-primary" type="button">
      </button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
